<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoxIL — ניהול מנויים</title>
<style>
  :root{
    --red:#D72B2B;--yellow:#F5C518;--black:#0A0A0A;
    --dark:#111111;--dark2:#1A1A1A;--gray:#2A2A2A;
    --white:#FFFFFF;--green:#22c55e;--orange:#f97316;
    --blue:#3b82f6;--muted:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--black);color:var(--white);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;direction:rtl}

  /* ── TOP BAR ── */
  .topbar{background:var(--dark2);border-bottom:1px solid var(--gray);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .topbar-logo{font-size:1.25rem;font-weight:800;letter-spacing:.5px}
  .topbar-logo span{color:var(--red)}
  .topbar-nav{display:flex;gap:1.2rem;align-items:center}
  .topbar-nav a{color:#aaa;text-decoration:none;font-size:.9rem;transition:color .2s}
  .topbar-nav a:hover,.topbar-nav a.active{color:var(--white)}
  .topbar-btn{background:var(--red);color:#fff;border:none;padding:.45rem 1.1rem;border-radius:6px;font-size:.85rem;cursor:pointer;font-weight:600;transition:opacity .2s}
  .topbar-btn:hover{opacity:.85}

  /* ── MAIN ── */
  .main{max-width:1200px;margin:0 auto;padding:2rem 1.5rem}

  /* ── PAGE HEADER ── */
  .page-header{margin-bottom:2rem}
  .page-header h1{font-size:1.7rem;font-weight:800;margin-bottom:.3rem}
  .page-header p{color:var(--muted);font-size:.9rem}

  /* ── STAT CARDS ── */
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem}
  .stat-card{background:var(--dark2);border:1px solid var(--gray);border-radius:10px;padding:1.2rem 1.4rem}
  .stat-label{color:var(--muted);font-size:.78rem;margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.5px}
  .stat-value{font-size:1.8rem;font-weight:800}
  .stat-value.green{color:var(--green)}
  .stat-value.yellow{color:var(--yellow)}
  .stat-value.red{color:var(--red)}
  .stat-sub{font-size:.78rem;color:var(--muted);margin-top:.3rem}

  /* ── TOOLBAR ── */
  .toolbar{display:flex;gap:.8rem;align-items:center;margin-bottom:1.2rem;flex-wrap:wrap}
  .search-box{flex:1;min-width:200px;background:var(--dark2);border:1px solid var(--gray);border-radius:8px;padding:.55rem 1rem;color:var(--white);font-size:.9rem;outline:none;direction:rtl}
  .search-box:focus{border-color:var(--red)}
  .search-box::placeholder{color:var(--muted)}
  .filter-btns{display:flex;gap:.4rem}
  .filter-btn{background:var(--dark2);border:1px solid var(--gray);color:#aaa;padding:.45rem .9rem;border-radius:6px;font-size:.82rem;cursor:pointer;transition:all .2s;white-space:nowrap}
  .filter-btn.active,.filter-btn:hover{background:var(--gray);color:var(--white);border-color:var(--red)}
  .add-btn{background:var(--red);color:#fff;border:none;padding:.55rem 1.2rem;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:.4rem;transition:opacity .2s}
  .add-btn:hover{opacity:.85}

  /* ── TABLE ── */
  .table-wrap{background:var(--dark2);border:1px solid var(--gray);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead{background:var(--gray)}
  th{text-align:right;padding:.9rem 1.1rem;font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  td{padding:.85rem 1.1rem;font-size:.88rem;border-top:1px solid #222;vertical-align:middle}
  tr:hover td{background:rgba(255,255,255,.02)}

  /* ── BADGES ── */
  .badge{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .7rem;border-radius:20px;font-size:.76rem;font-weight:700;white-space:nowrap}
  .badge-pro{background:rgba(245,197,24,.15);color:var(--yellow);border:1px solid rgba(245,197,24,.3)}
  .badge-free{background:rgba(107,114,128,.15);color:#9ca3af;border:1px solid #374151}
  .badge-active{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.3)}
  .badge-expired{background:rgba(215,43,43,.12);color:#f87171;border:1px solid rgba(215,43,43,.3)}
  .badge-trial{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}

  /* ── AVATAR ── */
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--red);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;margin-left:.6rem;flex-shrink:0}
  .subscriber-cell{display:flex;align-items:center}
  .sub-name{font-weight:600}
  .sub-email{font-size:.75rem;color:var(--muted)}

  /* ── ACTION BTNS ── */
  .actions{display:flex;gap:.4rem;justify-content:flex-start}
  .act-btn{background:transparent;border:1px solid var(--gray);color:#bbb;padding:.35rem .65rem;border-radius:6px;font-size:.78rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.2rem}
  .act-btn:hover{border-color:#555;color:var(--white)}
  .act-btn.wa{border-color:rgba(37,211,102,.3);color:#4ade80}
  .act-btn.wa:hover{background:rgba(37,211,102,.1)}
  .act-btn.edit:hover{border-color:var(--yellow);color:var(--yellow)}
  .act-btn.del:hover{border-color:#f87171;color:#f87171}

  /* ── RENEWAL PILL ── */
  .renewal{font-size:.8rem;color:var(--muted)}
  .renewal.soon{color:#fb923c}
  .renewal.overdue{color:#f87171}

  /* ── EMPTY STATE ── */
  .empty{text-align:center;padding:4rem 2rem;color:var(--muted)}
  .empty-icon{font-size:3rem;margin-bottom:1rem}

  /* ── MODAL OVERLAY ── */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:1rem}
  .modal-overlay.open{display:flex}
  .modal{background:var(--dark2);border:1px solid var(--gray);border-radius:14px;width:100%;max-width:500px;padding:2rem;position:relative;max-height:90vh;overflow-y:auto}
  .modal-title{font-size:1.1rem;font-weight:800;margin-bottom:1.5rem}
  .modal-close{position:absolute;top:1rem;left:1rem;background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;line-height:1}
  .modal-close:hover{color:var(--white)}

  /* ── FORM ── */
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
  .form-group{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
  .form-group label{font-size:.8rem;color:var(--muted);font-weight:600}
  .form-group input,.form-group select{background:var(--gray);border:1px solid #3a3a3a;color:var(--white);padding:.6rem .9rem;border-radius:8px;font-size:.9rem;outline:none;direction:rtl;width:100%}
  .form-group input:focus,.form-group select:focus{border-color:var(--red)}
  .form-group select option{background:var(--dark2)}
  .form-actions{display:flex;gap:.8rem;justify-content:flex-end;margin-top:1.2rem}
  .btn-cancel{background:var(--gray);color:#aaa;border:none;padding:.6rem 1.3rem;border-radius:8px;font-size:.88rem;cursor:pointer}
  .btn-save{background:var(--red);color:#fff;border:none;padding:.6rem 1.4rem;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer}
  .btn-cancel:hover{background:#333}
  .btn-save:hover{opacity:.85}

  /* ── REVENUE CHART STUB ── */
  .revenue-bar{height:6px;background:var(--gray);border-radius:3px;margin-top:.5rem;overflow:hidden}
  .revenue-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--yellow));border-radius:3px;transition:width .5s}

  /* ── TOAST ── */
  .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1f2937;border:1px solid var(--gray);color:var(--white);padding:.7rem 1.5rem;border-radius:8px;font-size:.88rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}

  /* ── RESPONSIVE ── */
  @media(max-width:900px){
    .stats-row{grid-template-columns:repeat(2,1fr)}
    .col-email,.col-renewal,.col-notes{display:none}
  }
  @media(max-width:600px){
    .stats-row{grid-template-columns:1fr 1fr}
    .main{padding:1rem}
    .topbar{padding:0 1rem}
    .form-row{grid-template-columns:1fr}
    .col-phone{display:none}
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">Box<span>IL</span> <span style="color:var(--muted);font-size:.75rem;font-weight:400;margin-right:.4rem">אדמין</span></div>
  <div class="topbar-nav">
    <a href="index.html">ראשי</a>
    <a href="trainer-portal.html">פורטל</a>
    <a href="admin-subscribers.html" class="active">מנויים</a>
    <button class="topbar-btn" onclick="openAddModal()">+ הוסף מנוי</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1>ניהול מנויים פעילים</h1>
    <p>כל המנויים, סטטוס תשלום ותאריכי חידוש במקום אחד</p>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">סה"כ מנויים</div>
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-sub" id="stat-sub-total"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">מנויי Pro</div>
      <div class="stat-value yellow" id="stat-pro">—</div>
      <div class="revenue-bar"><div class="revenue-fill" id="stat-pro-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">הכנסה חודשית</div>
      <div class="stat-value green" id="stat-revenue">—</div>
      <div class="stat-sub">₪149 × מנויי Pro</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">מתחדשים השבוע</div>
      <div class="stat-value red" id="stat-renewing">—</div>
      <div class="stat-sub" id="stat-renewing-sub"></div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <input class="search-box" type="text" placeholder="חיפוש לפי שם, מועדון או טלפון..." id="searchInput" oninput="renderTable()">
    <div class="filter-btns">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">הכל</button>
      <button class="filter-btn" data-filter="pro" onclick="setFilter('pro',this)">Pro</button>
      <button class="filter-btn" data-filter="free" onclick="setFilter('free',this)">חינם</button>
      <button class="filter-btn" data-filter="active" onclick="setFilter('active',this)">פעיל</button>
      <button class="filter-btn" data-filter="expired" onclick="setFilter('expired',this)">פג תוקף</button>
    </div>
    <button class="add-btn" onclick="openAddModal()">+ הוסף מנוי</button>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table id="subTable">
      <thead>
        <tr>
          <th>מנוי</th>
          <th class="col-phone">טלפון</th>
          <th>תוכנית</th>
          <th>סטטוס</th>
          <th class="col-renewal">חידוש</th>
          <th class="col-notes">הערות</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none">
      <div class="empty-icon">📋</div>
      <div>לא נמצאו מנויים תואמים</div>
    </div>
  </div>

</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle">הוסף מנוי חדש</div>
    <div class="form-row">
      <div class="form-group">
        <label>שם מלא *</label>
        <input type="text" id="f-name" placeholder="ישראל ישראלי">
      </div>
      <div class="form-group">
        <label>שם המועדון *</label>
        <input type="text" id="f-club" placeholder="מועדון האגרוף">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>טלפון *</label>
        <input type="tel" id="f-phone" placeholder="050-0000000">
      </div>
      <div class="form-group">
        <label>עיר</label>
        <input type="text" id="f-city" placeholder="תל אביב">
      </div>
    </div>
    <div class="form-group">
      <label>אימייל</label>
      <input type="email" id="f-email" placeholder="mail@example.com">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>תוכנית</label>
        <select id="f-plan">
          <option value="free">חינם (Free)</option>
          <option value="pro">Pro — ₪149/חודש</option>
        </select>
      </div>
      <div class="form-group">
        <label>סטטוס</label>
        <select id="f-status">
          <option value="active">פעיל</option>
          <option value="trial">ניסיון</option>
          <option value="expired">פג תוקף</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>תאריך הצטרפות</label>
        <input type="date" id="f-joined">
      </div>
      <div class="form-group">
        <label>תאריך חידוש</label>
        <input type="date" id="f-renewal">
      </div>
    </div>
    <div class="form-group">
      <label>הערות</label>
      <input type="text" id="f-notes" placeholder="פרטים נוספים...">
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeModal()">ביטול</button>
      <button class="btn-save" onclick="saveSubscriber()">שמור</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── STORAGE ──────────────────────────────────────────────
const STORE_KEY = 'boxil_subscribers';

const defaultSubs = [
  {id:1, name:'יוסי כהן',    club:'מועדון האגרוף תל אביב',    phone:'052-3456789', city:'תל אביב',   email:'yossi@gmail.com',   plan:'pro',  status:'active',  joined:'2025-11-10', renewal:'2026-06-10', notes:'BoxPool פעיל'},
  {id:2, name:'דוד לוי',     club:'בוקסינג אשדוד',            phone:'054-7654321', city:'אשדוד',     email:'david@gmail.com',   plan:'free', status:'active',  joined:'2025-12-01', renewal:'',          notes:''},
  {id:3, name:'אמיר ברקוביץ',club:'הוק בוקסינג ירושלים',      phone:'053-2345678', city:'ירושלים',   email:'amir@gmail.com',    plan:'pro',  status:'active',  joined:'2025-10-15', renewal:'2026-07-01', notes:'מנהל 3 סניפים'},
  {id:4, name:'מיכאל ג\'ורג\'י',club:'Fighting Zone חיפה',     phone:'050-9988776', city:'חיפה',      email:'mike@gmail.com',    plan:'pro',  status:'active',  joined:'2026-01-20', renewal:'2026-06-20', notes:''},
  {id:5, name:'רן שמיר',     club:'מועדון אפולה',              phone:'051-1122334', city:'אפולה',     email:'ran@gmail.com',     plan:'free', status:'active',  joined:'2026-02-05', renewal:'',          notes:''},
  {id:6, name:'שרה אלחדד',   club:'בנות האגרוף באר שבע',      phone:'052-5566778', city:'באר שבע',   email:'sara@gmail.com',    plan:'pro',  status:'active',  joined:'2025-09-01', renewal:'2026-07-10', notes:'BoxPool — 2 קבוצות'},
  {id:7, name:'תומר אריאב',  club:'צ\'מפיון בוקסינג נתניה',   phone:'054-4433221', city:'נתניה',     email:'tomer@gmail.com',   plan:'free', status:'trial',   joined:'2026-04-10', renewal:'2026-06-10', notes:'תקופת ניסיון'},
  {id:8, name:'נועה גולן',   club:'Lady Box ראשון לציון',      phone:'053-9988001', city:'ראשון לציון',email:'noa@gmail.com',    plan:'pro',  status:'expired', joined:'2025-08-01', renewal:'2026-05-01', notes:'לחדש — לא השיב'},
];

function loadSubs(){
  const raw = localStorage.getItem(STORE_KEY);
  if(!raw){
    localStorage.setItem(STORE_KEY, JSON.stringify(defaultSubs));
    return defaultSubs;
  }
  return JSON.parse(raw);
}

function saveSubs(subs){
  localStorage.setItem(STORE_KEY, JSON.stringify(subs));
}

// ── STATE ────────────────────────────────────────────────
let subs = loadSubs();
let currentFilter = 'all';
let editingId = null;

// ── STATS ────────────────────────────────────────────────
function updateStats(){
  const total   = subs.length;
  const active  = subs.filter(s=>s.status==='active').length;
  const pro     = subs.filter(s=>s.plan==='pro').length;
  const revenue = pro * 149;
  const today   = new Date();
  const in7days = new Date(today); in7days.setDate(today.getDate()+7);
  const renewing = subs.filter(s=>{
    if(!s.renewal||s.plan!=='pro') return false;
    const d = new Date(s.renewal);
    return d >= today && d <= in7days;
  }).length;

  document.getElementById('stat-total').textContent   = total;
  document.getElementById('stat-sub-total').textContent = `${active} פעילים`;
  document.getElementById('stat-pro').textContent     = pro;
  document.getElementById('stat-pro-bar').style.width = total ? (pro/total*100)+'%' : '0%';
  document.getElementById('stat-revenue').textContent = '₪'+revenue.toLocaleString();
  document.getElementById('stat-renewing').textContent = renewing;
  document.getElementById('stat-renewing-sub').textContent = renewing ? 'בשבוע הקרוב' : 'אין בשבוע הקרוב';
}

// ── FILTER ──────────────────────────────────────────────
function setFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

// ── RENDER ──────────────────────────────────────────────
function getInitials(name){
  return name.split(' ').slice(0,2).map(w=>w[0]).join('');
}

function renewalClass(dateStr, plan){
  if(!dateStr || plan==='free') return '';
  const d = new Date(dateStr);
  const today = new Date();
  const diff = Math.floor((d - today)/(1000*60*60*24));
  if(diff < 0) return 'overdue';
  if(diff <= 7) return 'soon';
  return '';
}

function fmtDate(dateStr){
  if(!dateStr) return '—';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

function renderTable(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  let filtered = subs.filter(s=>{
    if(q && !( s.name.includes(q)||s.club.includes(q)||s.phone.includes(q)||(s.city||'').includes(q) )) return false;
    if(currentFilter==='pro') return s.plan==='pro';
    if(currentFilter==='free') return s.plan==='free';
    if(currentFilter==='active') return s.status==='active';
    if(currentFilter==='expired') return s.status==='expired';
    return true;
  });

  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');

  if(!filtered.length){ tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  tbody.innerHTML = filtered.map(s=>{
    const planBadge  = s.plan==='pro'
      ? `<span class="badge badge-pro">⭐ Pro</span>`
      : `<span class="badge badge-free">Free</span>`;
    const statusBadge = s.status==='active'  ? `<span class="badge badge-active">● פעיל</span>`
                      : s.status==='trial'   ? `<span class="badge badge-trial">◌ ניסיון</span>`
                      :                        `<span class="badge badge-expired">✕ פג תוקף</span>`;
    const rc = renewalClass(s.renewal, s.plan);
    const renewalText = s.plan==='pro' && s.renewal
      ? `<span class="renewal ${rc}">${fmtDate(s.renewal)}</span>`
      : '<span class="renewal">—</span>';
    const wa = `https://wa.me/972${(s.phone||'').replace(/^0/,'').replace(/-/g,'')}?text=${encodeURIComponent('שלום '+s.name+', בנוגע למנוי שלך ב-BoxIL')}`;
    return `
    <tr>
      <td>
        <div class="subscriber-cell">
          <div class="avatar">${getInitials(s.name)}</div>
          <div>
            <div class="sub-name">${s.name}</div>
            <div class="sub-email">${s.club}${s.city?' · '+s.city:''}</div>
          </div>
        </div>
      </td>
      <td class="col-phone">${s.phone||'—'}</td>
      <td>${planBadge}</td>
      <td>${statusBadge}</td>
      <td class="col-renewal">${renewalText}</td>
      <td class="col-notes" style="color:var(--muted);font-size:.8rem">${s.notes||'—'}</td>
      <td>
        <div class="actions">
          <a href="${wa}" target="_blank"><button class="act-btn wa" title="WhatsApp">💬</button></a>
          <button class="act-btn edit" onclick="openEditModal(${s.id})" title="עריכה">✏️</button>
          <button class="act-btn del" onclick="deleteSub(${s.id})" title="מחק">🗑</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── MODAL ────────────────────────────────────────────────
function openAddModal(){
  editingId = null;
  document.getElementById('modalTitle').textContent = 'הוסף מנוי חדש';
  document.getElementById('f-name').value    = '';
  document.getElementById('f-club').value    = '';
  document.getElementById('f-phone').value   = '';
  document.getElementById('f-city').value    = '';
  document.getElementById('f-email').value   = '';
  document.getElementById('f-plan').value    = 'free';
  document.getElementById('f-status').value  = 'active';
  document.getElementById('f-joined').value  = new Date().toISOString().split('T')[0];
  document.getElementById('f-renewal').value = '';
  document.getElementById('f-notes').value   = '';
  document.getElementById('modal').classList.add('open');
}

function openEditModal(id){
  const s = subs.find(x=>x.id===id);
  if(!s) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'עריכת מנוי';
  document.getElementById('f-name').value    = s.name||'';
  document.getElementById('f-club').value    = s.club||'';
  document.getElementById('f-phone').value   = s.phone||'';
  document.getElementById('f-city').value    = s.city||'';
  document.getElementById('f-email').value   = s.email||'';
  document.getElementById('f-plan').value    = s.plan||'free';
  document.getElementById('f-status').value  = s.status||'active';
  document.getElementById('f-joined').value  = s.joined||'';
  document.getElementById('f-renewal').value = s.renewal||'';
  document.getElementById('f-notes').value   = s.notes||'';
  document.getElementById('modal').classList.add('open');
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
}

function saveSubscriber(){
  const name  = document.getElementById('f-name').value.trim();
  const club  = document.getElementById('f-club').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  if(!name||!club||!phone){ showToast('שם, מועדון וטלפון הם שדות חובה'); return; }

  const data = {
    name, club, phone,
    city:    document.getElementById('f-city').value.trim(),
    email:   document.getElementById('f-email').value.trim(),
    plan:    document.getElementById('f-plan').value,
    status:  document.getElementById('f-status').value,
    joined:  document.getElementById('f-joined').value,
    renewal: document.getElementById('f-renewal').value,
    notes:   document.getElementById('f-notes').value.trim(),
  };

  if(editingId){
    const idx = subs.findIndex(x=>x.id===editingId);
    subs[idx] = {...subs[idx], ...data};
    showToast('המנוי עודכן בהצלחה ✓');
  } else {
    const newId = subs.length ? Math.max(...subs.map(x=>x.id))+1 : 1;
    subs.push({id:newId, ...data});
    showToast('מנוי חדש נוסף ✓');
  }

  saveSubs(subs);
  closeModal();
  renderTable();
  updateStats();
}

function deleteSub(id){
  const s = subs.find(x=>x.id===id);
  if(!s) return;
  if(!confirm(`האם למחוק את ${s.name}?`)) return;
  subs = subs.filter(x=>x.id!==id);
  saveSubs(subs);
  renderTable();
  updateStats();
  showToast('מנוי נמחק');
}

// ── TOAST ────────────────────────────────────────────────
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ── CLOSE MODAL ON OVERLAY CLICK ─────────────────────────
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});

// ── INIT ─────────────────────────────────────────────────
updateStats();
renderTable();
</script>
</body>
</html>
