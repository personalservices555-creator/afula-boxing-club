<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoxIL | מצא מועדון איגרוף קרוב אליך</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D72B2B;
  --red-dark:#9E1111;
  --yellow:#F5C518;
  --black:#0A0A0A;
  --dark:#111111;
  --dark2:#1A1A1A;
  --gray:#2A2A2A;
  --white:#FFFFFF;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Heebo',sans-serif;background:var(--black);color:var(--white);direction:rtl;overflow-x:hidden;min-height:100vh}

/* NAV */
nav{position:fixed;top:0;right:0;left:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.5rem;background:rgba(10,10,10,.97);backdrop-filter:blur(18px);border-bottom:1px solid rgba(215,43,43,.18)}
.nav-logo{font-size:1.2rem;font-weight:900;letter-spacing:.04em;text-decoration:none;color:var(--white)}
.nav-logo span{color:var(--red)}
.nav-logo small{display:block;font-size:.54rem;font-weight:300;color:rgba(255,255,255,.3);letter-spacing:.12em}
.nav-back{color:rgba(255,255,255,.55);font-size:.82rem;text-decoration:none;transition:color .2s;display:flex;align-items:center;gap:.35rem}
.nav-back:hover{color:var(--yellow)}

/* HERO */
.page-hero{padding:8rem 1.5rem 3rem;text-align:center}
.page-tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.18em;color:var(--red);text-transform:uppercase;margin-bottom:.8rem}
.page-h1{font-size:clamp(2rem,5vw,3rem);font-weight:900;line-height:1.1;margin-bottom:1rem}
.page-sub{font-size:1rem;color:rgba(255,255,255,.5);font-weight:300;max-width:480px;margin:0 auto 2.5rem;line-height:1.65}

/* LOCATION BAR */
.loc-bar{max-width:600px;margin:0 auto 3rem;padding:0 1rem}
.loc-input-wrap{display:flex;gap:.6rem}
.loc-input{flex:1;background:var(--dark2);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:.75rem 1rem;color:var(--white);font-family:'Heebo',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s}
.loc-input:focus{border-color:var(--red)}
.loc-btn{background:var(--red);color:var(--white);border:none;border-radius:4px;padding:.75rem 1.2rem;font-family:'Heebo',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;transition:background .2s;white-space:nowrap;display:flex;align-items:center;gap:.4rem}
.loc-btn:hover{background:var(--red-dark)}
.loc-btn.geo{background:var(--dark2);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
.loc-btn.geo:hover{border-color:var(--white);color:var(--white)}
.loc-status{text-align:center;font-size:.78rem;color:rgba(255,255,255,.35);margin-top:.8rem;min-height:1.2em}

/* CLUBS LIST */
.clubs-wrap{max-width:700px;margin:0 auto;padding:0 1rem 5rem}
.clubs-section-title{font-size:.7rem;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.28);text-transform:uppercase;margin-bottom:1.4rem}

/* CLUB CARD */
.club-card{background:var(--dark2);border:1px solid rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-bottom:1.2rem;transition:border-color .25s,transform .25s}
.club-card:hover{border-color:rgba(215,43,43,.4);transform:translateY(-3px)}
.club-card-head{padding:1.5rem 1.8rem 1.2rem;display:flex;align-items:flex-start;gap:1.2rem}
.club-emblem{width:52px;height:52px;background:linear-gradient(135deg,var(--red-dark),var(--red));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.club-info{flex:1}
.club-name{font-size:1.15rem;font-weight:900;margin-bottom:.25rem}
.club-city{font-size:.78rem;color:rgba(255,255,255,.4);font-weight:300;margin-bottom:.5rem;display:flex;align-items:center;gap:.35rem}
.club-dist{display:inline-block;background:rgba(215,43,43,.12);border:1px solid rgba(215,43,43,.25);color:var(--red);font-size:.66rem;font-weight:700;padding:.18rem .55rem;border-radius:20px;margin-right:.4rem}
.club-body{padding:0 1.8rem 1.2rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:500px){.club-body{grid-template-columns:1fr}}
.club-section{display:flex;flex-direction:column;gap:.35rem}
.club-section-label{font-size:.65rem;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.3);text-transform:uppercase}
.club-section-val{font-size:.85rem;color:rgba(255,255,255,.75);line-height:1.55}
.hours-row{display:flex;gap:.5rem;align-items:baseline;font-size:.83rem;color:rgba(255,255,255,.65)}
.hours-day{color:rgba(255,255,255,.35);font-size:.75rem;min-width:45px}
.club-desc{padding:0 1.8rem 1.2rem;font-size:.84rem;color:rgba(255,255,255,.5);line-height:1.65;border-top:1px solid rgba(255,255,255,.06);padding-top:1rem;margin-top:.2rem}
.club-actions{padding:1rem 1.8rem 1.5rem;display:flex;gap:.75rem;flex-wrap:wrap}
.club-btn{display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;border-radius:3px;font-weight:700;font-size:.82rem;padding:.56rem 1.1rem;transition:all .2s;cursor:pointer;border:none;font-family:'Heebo',sans-serif}
.club-btn-primary{background:var(--red);color:var(--white)}
.club-btn-primary:hover{background:var(--red-dark)}
.club-btn-outline{background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.65)}
.club-btn-outline:hover{border-color:var(--white);color:var(--white)}
.club-badge{display:inline-block;background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.3);color:var(--yellow);font-size:.62rem;font-weight:700;padding:.18rem .55rem;border-radius:20px;vertical-align:middle;margin-right:.3rem}

/* COMING SOON CARD */
.coming-card{background:var(--dark2);border:1px solid rgba(255,255,255,.05);border-radius:6px;padding:2rem 1.8rem;text-align:center;color:rgba(255,255,255,.25)}
.coming-card .coming-icon{font-size:2rem;margin-bottom:.8rem}
.coming-card p{font-size:.82rem;line-height:1.55}

/* LOADING STATE */
.loc-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--white);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-left:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* FOOTER */
footer{text-align:center;padding:2rem;color:rgba(255,255,255,.2);font-size:.75rem;border-top:1px solid rgba(255,255,255,.05)}
footer a{color:rgba(255,255,255,.3);text-decoration:none}
footer a:hover{color:var(--yellow)}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Box<span>IL</span><small>פלטפורמת האיגרוף הישראלית</small></a>
  <a href="index.html" class="nav-back">← חזרה לדף הראשי</a>
</nav>

<div class="page-hero">
  <div class="page-tag">🥊 מתאמן</div>
  <h1 class="page-h1">מצא את מועדון<br>האיגרוף <span style="color:var(--red)">הקרוב אליך</span></h1>
  <p class="page-sub">אנחנו נמצא את המועדון המתאים לך — עם כל הפרטים שצריך כדי להתחיל לאמן.</p>
</div>

<div class="loc-bar">
  <div class="loc-input-wrap">
    <input type="text" class="loc-input" id="city-input" placeholder="הקלד עיר או יישוב..." onkeydown="if(event.key==='Enter')searchByCity()">
    <button class="loc-btn" onclick="searchByCity()">🔍 חיפוש</button>
    <button class="loc-btn geo" id="geo-btn" onclick="detectLocation()" title="מיקום אוטומטי">📍</button>
  </div>
  <div class="loc-status" id="loc-status">חפש לפי עיר, או לחץ 📍 לאיתור אוטומטי</div>
</div>

<div class="clubs-wrap">
  <div class="clubs-section-title" id="clubs-label">מועדונים זמינים</div>
  <div id="clubs-list">
    <!-- rendered by JS -->
  </div>
</div>

<footer>
  <a href="index.html">BoxIL</a> · כל הזכויות שמורות · פלטפורמת האיגרוף הישראלית
</footer>

<script>
const CLUBS = [
  {
    id: 'afula',
    name: 'NI Boxing Club',
    city: 'עפולה',
    region: 'צפון',
    address: 'עפולה, הגליל התחתון',
    lat: 32.6075,
    lon: 35.2897,
    phone: '0548274422',
    wa: '9720548274422',
    hours: [
      { days: 'ראשון–חמישי', time: '06:00–21:30' },
      { days: 'שישי', time: '06:00–14:00' },
      { days: 'מוצאי שבת', time: 'עד 22:00' }
    ],
    desc: 'מועדון האיגרוף המוביל בעפולה וסביבותיה. אימונים לכל הרמות — ממתחילים ועד תחרותי. מאמנים מוסמכים עם ניסיון אלופות ארצי ובינלאומי. אווירה משפחתית, ציוד מקצועי, קבוצות נוער ובוגרים.',
    tags: ['מומלץ', 'קבוצות נוער', 'אימון פרטי'],
    page: 'afula.html',
    featured: true
  }
];

function deg2rad(d){ return d * Math.PI / 180; }
function distKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = deg2rad(lat2 - lat1);
  const dLon = deg2rad(lon2 - lon1);
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*
            Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function renderClubs(clubs, withDist){
  const list = document.getElementById('clubs-list');
  const label = document.getElementById('clubs-label');
  if (!clubs.length) {
    list.innerHTML = `<div class="coming-card"><div class="coming-icon">🔍</div><p>לא נמצאו מועדונים באזור זה עדיין.<br>נסה אזור אחר או <a href="index.html#cta" style="color:var(--yellow)">פנה אלינו להוסיף מועדון</a>.</p></div>`;
    label.textContent = 'תוצאות חיפוש';
    return;
  }
  label.textContent = withDist ? `${clubs.length} מועדון${clubs.length>1?'ות':''} נמצאו` : 'מועדונים זמינים';
  list.innerHTML = clubs.map(c => `
    <div class="club-card">
      <div class="club-card-head">
        <div class="club-emblem">🥊</div>
        <div class="club-info">
          <div class="club-name">
            ${c.featured ? `<span class="club-badge">מומלץ</span>` : ''}
            ${c.name}
          </div>
          <div class="club-city">
            📍 ${c.city}${c.dist !== undefined ? ` <span class="club-dist">${c.dist < 1 ? 'פחות מ-1' : Math.round(c.dist)} ק"מ ממך</span>` : ''}
          </div>
        </div>
      </div>

      <div class="club-body">
        <div class="club-section">
          <div class="club-section-label">⏰ שעות פעילות</div>
          ${c.hours.map(h => `<div class="hours-row"><span class="hours-day">${h.days}</span>${h.time}</div>`).join('')}
        </div>
        <div class="club-section">
          <div class="club-section-label">📞 יצירת קשר</div>
          <div class="club-section-val">
            <a href="tel:${c.phone}" style="color:rgba(255,255,255,.75);text-decoration:none">${c.phone}</a>
          </div>
          <div class="club-section-label" style="margin-top:.6rem">📍 כתובת</div>
          <div class="club-section-val">${c.address}</div>
        </div>
      </div>

      <div class="club-desc">${c.desc}</div>

      <div class="club-actions">
        <a href="${c.page}" class="club-btn club-btn-primary">🥊 פרטים מלאים והזמנת אימון</a>
        <a href="https://wa.me/${c.wa}?text=היי%20👋%20אני%20מעוניין%20להצטרף%20לאימונים!" target="_blank" rel="noopener" class="club-btn club-btn-outline">💬 וואטסאפ</a>
      </div>
    </div>
  `).join('') + `
    <div class="coming-card" style="margin-top:1.5rem">
      <div class="coming-icon">📍</div>
      <p>מועדונים נוספים בדרך — <a href="index.html#cta" style="color:var(--yellow)">מועדון שלך לא מופיע?</a> הצטרף ל-BoxIL</p>
    </div>
  `;
}

function searchByCity(){
  const q = document.getElementById('city-input').value.trim();
  if (!q) return;
  setStatus(`מחפש מועדונים ב${q}...`);
  const matched = CLUBS.filter(c =>
    c.city.includes(q) || c.region.includes(q) || c.address.includes(q) ||
    q.includes(c.city) || c.name.includes(q)
  );
  setTimeout(() => {
    setStatus(matched.length ? '' : `לא נמצאו תוצאות עבור "${q}"`);
    renderClubs(matched, false);
  }, 400);
}

function detectLocation(){
  if (!navigator.geolocation) {
    setStatus('הדפדפן לא תומך באיתור מיקום');
    return;
  }
  setStatus('מאתר מיקום... <span class="loc-spinner"></span>');
  document.getElementById('geo-btn').disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      const withDist = CLUBS.map(c => ({ ...c, dist: distKm(lat, lon, c.lat, c.lon) }))
                            .sort((a, b) => a.dist - b.dist);
      setStatus(`נמצאו ${withDist.length} מועדון${withDist.length>1?'ות':''} באזורך`);
      document.getElementById('geo-btn').disabled = false;
      renderClubs(withDist, true);
    },
    err => {
      document.getElementById('geo-btn').disabled = false;
      setStatus('לא הצלחנו לאתר מיקום — נסה לחפש לפי עיר');
      renderClubs(CLUBS, false);
    },
    { timeout: 8000, maximumAge: 60000 }
  );
}

function setStatus(html){
  document.getElementById('loc-status').innerHTML = html;
}

// default: show all clubs on load
renderClubs(CLUBS, false);
</script>
</body>
</html>
